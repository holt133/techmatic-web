<!-- Add this inside your main <div>, below the text -->
<form id="contactForm">
    <input type="text" id="name" placeholder="Enter Your Name" required />
    <textarea id="message" placeholder="Enter Your Message" rows="4" required></textarea>
    <button type="submit" id="submitBtn">Send to Telegram</button>
</form>

<script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Sending...';
        
        const payload = {
            name: document.getElementById('name').value,
            message: document.getElementById('message').value
        };

        try {
            // Replace 'contact-form' with whatever path you set in n8n
            await fetch('https://n8n.techmatic.ai/webhook-test/contact-form', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            btn.innerText = 'Message Sent!';
            document.getElementById('contactForm').reset();
        } catch (error) {
            btn.innerText = 'Error - Try Again';
        }
    });
</script>
