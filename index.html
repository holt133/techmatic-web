<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techmatic AI</title>
    <style>
        /* --- 1. BASE STYLES --- */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            text-align: center;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 80px); 
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            line-height: 1.6;
            padding: 0 1.5rem;
        }

        /* --- 2. NAVBAR STYLES --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }
        
        .nav-logo {
            height: 45px;
            width: auto;
            display: block;
        }
        
        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s ease;
            padding: 20px 0;
            display: inline-block;
        }

        .nav-links a:hover {
            color: #38bdf8; 
        }
        
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 1.5rem; 
            background: transparent;
}

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            margin-top: 1rem; /* The visual gap is back! */
            background-color: #1e293b;
            min-width: 220px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 999;
            border-radius: 0.5rem;
            overflow: hidden;
            text-align: left;
        }

        .dropdown-content a {
            padding: 12px 16px;
            display: block;
            border-bottom: 1px solid #334155;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: #334155;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <!-- --- 3. NAVBAR HTML --- -->
    <nav class="navbar">
        <a href="index.html" class="logo-link">
            <img src="https://images.techmatic.ai/techmatic-logo-tagline-dark-enhanced.png" alt="Techmatic AI Logo" class="nav-logo">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li class="dropdown">
                <a href="the-missing-word.html" class="dropbtn">The Missing Word ▾</a>
                <div class="dropdown-content">
                    <a href="tmw-instructions.html">User Instructions</a>
                    <a href="tmw-terms.html">Terms & Conditions</a>
                    <a href="tmw-privacy.html">Privacy Policy</a>
                    <a href="tmw-complaints.html">Complaints Procedure</a>
                </div>
            </li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- --- 4. MAIN CONTENT HTML --- -->
    <div class="main-content">
        <div>
            <h1>Techmatic AI</h1>
            <p>Exploring artificial intelligence, intelligent system integrations, and data automation.</p>
            <p><em>Full website coming soon. It will be cool.</em></p>
        </div>
    </div>
</body>
</html>
