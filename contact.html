<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Techmatic AI</title>
    <style>
        /* --- 1. BASE & NAVBAR STYLES (Same as index.html) --- */
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; text-align: center; }
        .main-content { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 2rem 1rem; box-sizing: border-box; }
        h1 { font-size: 3.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 1.25rem; color: #94a3b8; max-width: 600px; line-height: 1.6; padding: 0 1.5rem; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background-color: #0f172a; border-bottom: 1px solid #334155; }
        .nav-logo { height: 45px; width: auto; display: block; }
        .nav-links { list-style: none; display: flex; gap: 2rem; margin: 0; padding: 0; align-items: center; }
        .nav-links a { color: #f8fafc; text-decoration: none; font-weight: 500; font-size: 1rem; transition: color 0.2s ease; }
        .nav-links a:hover { color: #38bdf8; }
        
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #1e293b; min-width: 220px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 1; border-radius: 0.5rem; margin-top: 1rem; overflow: hidden; }
        .dropdown-content a { padding: 12px 16px; display: block; border-bottom: 1px solid #334155; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #334155; }
        .dropdown:hover .dropdown-content { display: block; }

        /* --- 2. FORM STYLES --- */
        form { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 400px; }
        input, textarea { padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-family: inherit; }
        button { padding: 0.75rem; border-radius: 0.5rem; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
        button:hover { background: #818cf8; }
    </style>
</head>
<body>
    <!-- --- 3. NAVBAR HTML --- -->
    <nav class="navbar">
        <a href="index.html" class="logo-link">
            <img src="https://https://images.techmatic.ai/techmatic_logo.jpeg" alt="Techmatic AI Logo" class="nav-logo">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li class="dropdown">
                <a href="the-missing-word.html" class="dropbtn">The Missing Word &#9662;</a>
                <div class="dropdown-content">
                    <a href="tmw-instructions.html">User Instructions</a>
                    <a href="tmw-terms.html">Terms & Conditions</a>
                    <a href="tmw-privacy.html">Privacy Policy</a>
                    <a href="tmw-complaints.html">Complaints Procedure</a>
                </div>
            </li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- --- 4. MAIN CONTENT HTML --- -->
    <div class="main-content">
        <h1>Contact Us</h1>
        <p>Have a question about intelligent automation? Send us a message.</p>

        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name" required />
            <input type="email" id="email" placeholder="Your Email" required />
            <textarea id="message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit" id="submitBtn">Send Message</button>
        </form>
    </div>

    <!-- --- 5. N8N WEBHOOK SCRIPT --- -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Sending...';
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('https://n8n.techmatic.ai/webhook/contact-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('Server rejected request');

                btn.innerText = 'Message Sent!';
                document.getElementById('contactForm').reset();
            } catch (error) {
                btn.innerText = 'Error - Try Again';
            }
        });
    </script>
</body>
</html>
